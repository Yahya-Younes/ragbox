name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start ragbox with a fake model server
        run: docker compose -f compose.yaml -f tests/e2e/compose.e2e.yaml up -d --build --wait
      - name: Upload, index, ask, check citations and security rules
        run: tests/e2e/run_e2e.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f tests/e2e/compose.e2e.yaml logs
      - run: docker compose -f compose.yaml -f tests/e2e/compose.e2e.yaml down -v
        if: always()
