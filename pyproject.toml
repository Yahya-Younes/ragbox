[project]
name = "ragbox"
version = "0.1.0"
description = "The simplest local RAG: drop your files, ask questions, everything stays on your machine."
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608"]  # asserts in tests; SQL built only from placeholders

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"ragbox/prompts.py" = ["E501"]  # prompt prose

[tool.pytest.ini_options]
testpaths = ["tests"]
